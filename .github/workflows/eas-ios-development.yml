name: EAS Build - iOS Development

on:
  push:
    branches:
      - main

jobs:
  ios-development:
    runs-on: macos-latest

    steps:
      # 1️⃣ Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # 3️⃣ Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 4️⃣ Set Expo Token (from GitHub Secrets)
      - name: Set Expo Token
        run: echo "EXPO_TOKEN=${{ secrets.Preview_ios_CICD_token }}" >> $GITHUB_ENV

      # 5️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 6️⃣ Trigger EAS iOS Development build
      - name: EAS Build - iOS Development
        run: eas build --platform ios --profile development --non-interactive
