name: EAS Build - Android Development

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  android-development:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # ✅ Node 22 works fine, but ensure Expo SDK supports it

      # 3️⃣ Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # 4️⃣ Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      # 5️⃣ Set Expo token for CI/CD
      - name: Set Expo token
        env:
          EXPO_TOKEN: ${{ secrets.PREVIEW_ANDROID_CICD_TOKEN }}
        run: |
          echo "EXPO_TOKEN=${EXPO_TOKEN}" >> $GITHUB_ENV

      # 6️⃣ Install project dependencies
      - name: Install dependencies
        run: npm ci
        # ✅ npm ci is faster & cleaner than npm install in CI

      # 7️⃣ Ensure expo-dev-client is installed
      - name: Ensure expo-dev-client
        run: npx expo install expo-dev-client

      # 8️⃣ Run EAS build
      - name: EAS Build Android Development
        env:
          EXPO_TOKEN: ${{ secrets.PREVIEW_ANDROID_CICD_TOKEN }}
        run: eas build --platform android --profile development --non-interactive
